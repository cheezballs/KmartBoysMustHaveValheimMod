<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="75%">
      <stop offset="0" stop-color="#fff35c"/>
      <stop offset="0.35" stop-color="#ff3fa4"/>
      <stop offset="0.7" stop-color="#5b1aa8"/>
      <stop offset="1" stop-color="#0b0420"/>
    </radialGradient>
    <radialGradient id="eye" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.8" stop-color="#f1e6ff"/>
      <stop offset="1" stop-color="#c9a7f0"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00ffd0"/>
      <stop offset="0.6" stop-color="#00a37a"/>
      <stop offset="1" stop-color="#033"/>
    </radialGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb000"/>
      <stop offset="1" stop-color="#ff2a00"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="1" stop-color="#c8b48a"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" fill="url(#bg)"/>

  <!-- sunburst rays -->
  <g opacity="0.22" fill="#ffffff" transform="translate(128 140)">
    <path d="M0 0 L-14 -200 L14 -200Z"/>
    <path d="M0 0 L-14 -200 L14 -200Z" transform="rotate(30)"/>
    <path d="M0 0 L-14 -200 L14 -200Z" transform="rotate(60)"/>
    <path d="M0 0 L-14 -200 L14 -200Z" transform="rotate(90)"/>
    <path d="M0 0 L-14 -200 L14 -200Z" transform="rotate(120)"/>
    <path d="M0 0 L-14 -200 L14 -200Z" transform="rotate(150)"/>
    <path d="M0 0 L-14 -200 L14 -200Z" transform="rotate(180)"/>
    <path d="M0 0 L-14 -200 L14 -200Z" transform="rotate(210)"/>
    <path d="M0 0 L-14 -200 L14 -200Z" transform="rotate(240)"/>
    <path d="M0 0 L-14 -200 L14 -200Z" transform="rotate(270)"/>
    <path d="M0 0 L-14 -200 L14 -200Z" transform="rotate(300)"/>
    <path d="M0 0 L-14 -200 L14 -200Z" transform="rotate(330)"/>
  </g>

  <!-- cheese moon -->
  <circle cx="212" cy="40" r="26" fill="#ffd23a" stroke="#b88a00" stroke-width="3"/>
  <circle cx="203" cy="33" r="5" fill="#d9a300"/>
  <circle cx="220" cy="48" r="7" fill="#d9a300"/>
  <circle cx="221" cy="28" r="3" fill="#d9a300"/>

  <!-- lightning bolts -->
  <path d="M28 20 L52 20 L38 46 L54 46 L22 92 L32 56 L16 56Z" fill="#fff35c" stroke="#3a0066" stroke-width="3" stroke-linejoin="round"/>
  <path d="M236 98 L248 98 L240 112 L250 112 L232 138 L237 118 L228 118Z" fill="#00ffd0" stroke="#3a0066" stroke-width="2" stroke-linejoin="round"/>

  <!-- lava sea -->
  <path d="M0 214 Q20 200 40 214 T80 214 T120 214 T160 214 T200 214 T240 214 T280 214 V256 H0Z" fill="url(#lava)"/>
  <path d="M0 228 Q24 218 48 228 T96 228 T144 228 T192 228 T240 228 T288 228" fill="none" stroke="#fff35c" stroke-width="3" opacity="0.7"/>

  <!-- flame trail behind cart -->
  <g transform="translate(0 0)">
    <path d="M60 176 Q30 160 8 178 Q30 182 20 196 Q40 186 62 192Z" fill="#ff7a00"/>
    <path d="M60 180 Q38 172 24 182 Q40 186 34 194 Q48 188 62 190Z" fill="#fff35c"/>
  </g>

  <!-- shopping cart, tilted, flying -->
  <g transform="rotate(-10 128 170)" stroke="#1a0033" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <path d="M40 120 L62 120 L82 190 L196 190"/>
    <path d="M66 136 L212 136 L196 182 L80 182Z" fill="#c9d1e0" fill-opacity="0.35"/>
    <path d="M100 136 L104 182 M136 136 L136 182 M172 136 L166 182 M72 158 L204 158"/>
    <circle cx="96" cy="206" r="10" fill="#1a0033"/>
    <circle cx="182" cy="206" r="10" fill="#1a0033"/>
    <circle cx="96" cy="206" r="4" fill="#ff3fa4" stroke="none"/>
    <circle cx="182" cy="206" r="4" fill="#ff3fa4" stroke="none"/>
  </g>

  <!-- giant eyeball riding in the cart -->
  <g transform="translate(140 104)">
    <circle r="50" fill="url(#eye)" stroke="#1a0033" stroke-width="5"/>
    <!-- veins -->
    <g stroke="#e0386b" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M-46 8 Q-34 4 -28 12 Q-22 18 -16 14"/>
      <path d="M44 18 Q34 14 30 22"/>
      <path d="M-30 -36 Q-22 -26 -24 -18"/>
      <path d="M30 40 Q22 32 14 36"/>
    </g>
    <circle cx="6" cy="8" r="24" fill="url(#iris)" stroke="#022" stroke-width="3"/>
    <circle cx="8" cy="10" r="11" fill="#05010f"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>

  <!-- viking helmet on the eyeball -->
  <g transform="translate(140 104)">
    <path d="M-46 -22 Q0 -82 46 -22 Z" fill="#8a8f9c" stroke="#1a0033" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-48 -22 L48 -22" stroke="#c99a2e" stroke-width="9" stroke-linecap="round"/>
    <circle cx="-26" cy="-22" r="3" fill="#fff6c8"/>
    <circle cx="0" cy="-22" r="3" fill="#fff6c8"/>
    <circle cx="26" cy="-22" r="3" fill="#fff6c8"/>
    <!-- horns -->
    <path d="M-40 -36 Q-74 -44 -78 -86 Q-62 -60 -36 -54 Z" fill="url(#horn)" stroke="#1a0033" stroke-width="4" stroke-linejoin="round"/>
    <path d="M40 -36 Q74 -44 78 -86 Q62 -60 36 -54 Z" fill="url(#horn)" stroke="#1a0033" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- tiny goat clinging to the cart handle -->
  <g transform="translate(34 104) rotate(-14)">
    <ellipse cx="0" cy="0" rx="13" ry="9" fill="#ffffff" stroke="#1a0033" stroke-width="3"/>
    <circle cx="-13" cy="-7" r="7" fill="#ffffff" stroke="#1a0033" stroke-width="3"/>
    <path d="M-17 -13 Q-22 -22 -16 -24 M-11 -13 Q-10 -22 -5 -21" stroke="#1a0033" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="-15" cy="-7" r="1.6" fill="#1a0033"/>
    <path d="M-6 8 L-7 15 M5 8 L6 15" stroke="#1a0033" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- floating sparkles -->
  <g fill="#ffffff">
    <path d="M226 186 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path d="M70 34 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/>
    <path d="M120 22 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
  </g>

  <!-- border -->
  <rect x="3" y="3" width="250" height="250" rx="18" fill="none" stroke="#fff35c" stroke-width="6"/>
</svg>
